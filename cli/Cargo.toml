[package]
name = "petrovich-cli"
version = "0.2.0"
edition = "2024"
description = "Command-line interface for petrovich-core (Russian name inflection)"
license = "MIT"

[[bin]]
name = "petrovich"
path = "src/main.rs"

[dependencies]
petrovich-core = { path = ".." }
petrovich-com = { path = "../com" }
# NOTE: `color` is off — anstream's windows-sys dep needs dlltool, which the
# gnu toolchain here lacks. Plain-text help is fine for 1C/scripts piping.
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context", "suggestions"] }
